name: Go

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          # prebuilt linter binaries can lag behind go.mod
          install-mode: goinstall
          # config verification downloads a schema and fails on network hiccups
          verify: false

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forgedeck
          POSTGRES_PASSWORD: forgedeck
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgedeck"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FORGEDECK_TEST_DATABASE_URL: postgres://forgedeck:forgedeck@localhost:5432/postgres?sslmode=disable
      FORGEDECK_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  # the production image is what deploy/compose runs
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/Dockerfile --build-arg VERSION=ci -t forgedeck-api:ci .
      # the image has no shell: run its own commands (no config must fail fast, health check must not hang)
      - name: The image starts, explains a bad configuration, and is non-root
        run: |
          out=$(docker run --rm forgedeck-api:ci serve 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "FORGEDECK_DATABASE_URL is required"
          test "$(docker inspect forgedeck-api:ci --format '{{.Config.User}}')" = "nonroot:nonroot"
          ! docker run --rm forgedeck-api:ci healthcheck
