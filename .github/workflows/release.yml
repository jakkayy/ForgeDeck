name: Release

# A tag such as v0.1.0 publishes the Agent and Runner binaries (GitHub Releases)
# and the Control Plane image (GHCR), for amd64 and arm64.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the Agent and Runner for amd64 and arm64
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            for cmd in agent runner; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "dist/forgedeck-${cmd}-linux-${arch}" "./cmd/${cmd}"
            done
          done
          cp deploy/agent/install.sh dist/install-agent.sh
          cp deploy/agent/forgedeck-agent.service dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/forgedeck-api" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
