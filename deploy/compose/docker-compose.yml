# the name must differ from the dev stack ("forgedeck"): shared names share containers and volumes
name: forgedeck-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgedeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (letters and digits only)}
      POSTGRES_DB: forgedeck
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [db]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgedeck -d forgedeck"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${FORGEDECK_VERSION:-dev}
    image: forgedeck-api:${FORGEDECK_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FORGEDECK_HTTP_ADDR: ":8080"
      FORGEDECK_DATABASE_URL: postgres://forgedeck:${POSTGRES_PASSWORD}@postgres:5432/forgedeck?sslmode=disable
      # not in the database or backups: keep it safe (docs/16-backup-restore.md)
      FORGEDECK_SECRET_KEYS: ${FORGEDECK_SECRET_KEYS:?set FORGEDECK_SECRET_KEYS in .env (openssl rand -base64 32, as v1:<key>)}
      FORGEDECK_PUBLIC_URL: ${FORGEDECK_PUBLIC_URL:-https://${FORGEDECK_DOMAIN:?set FORGEDECK_DOMAIN in .env}}
      # HTTPS: secure cookies and HSTS
      FORGEDECK_COOKIE_SECURE: "true"
      # proxy address: only its X-Forwarded-For is trusted (real client IPs for rate limits)
      FORGEDECK_TRUSTED_PROXIES: 172.30.0.2
      FORGEDECK_LOG_FORMAT: json
      # optional, from .env when set
      FORGEDECK_LOG_LEVEL:
      FORGEDECK_ALLOW_PRIVATE_GIT_HOSTS:
      FORGEDECK_DISABLE_WEB_SETUP:
      FORGEDECK_GITHUB_APP_ID:
      FORGEDECK_GITHUB_APP_SLUG:
      FORGEDECK_GITHUB_CLIENT_ID:
      FORGEDECK_GITHUB_CLIENT_SECRET:
      FORGEDECK_GITHUB_APP_PRIVATE_KEY:
      FORGEDECK_GITHUB_WEBHOOK_SECRET:
      FORGEDECK_RETENTION_JOB_LOGS_DAYS:
      FORGEDECK_RETENTION_JOBS_DAYS:
      FORGEDECK_RETENTION_WEBHOOKS_DAYS:
      FORGEDECK_RETENTION_AUDIT_DAYS:
    networks: [db, web]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # no shell or curl in the image
      test: ["CMD", "/forgedeck-api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      FORGEDECK_DOMAIN: ${FORGEDECK_DOMAIN}
    ports:
      - "${FORGEDECK_HTTP_PORT:-80}:80"
      - "${FORGEDECK_HTTPS_PORT:-443}:443"
      - "${FORGEDECK_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # losing these means requesting new certificates
      - caddy-data:/data
      - caddy-config:/config
    networks:
      web:
        ipv4_address: 172.30.0.2
    security_opt: [no-new-privileges:true]

networks:
  # no route out of the stack
  db:
    internal: true
  web:
    ipam:
      config:
        # dynamic addresses come from the upper half so the proxy's 172.30.0.2 is never taken
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
